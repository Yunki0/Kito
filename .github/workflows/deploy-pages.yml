name: Deploy download page

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - lib/**
      - web/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build Kito web app
        run: flutter build web --release --base-href /Kito/app/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Add web app to site
        run: |
          mkdir -p docs/app
          cp -a build/web/. docs/app/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
